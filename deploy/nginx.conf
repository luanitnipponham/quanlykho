server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tệp đính kèm có thể tới 25 MB (workflow §8.2).
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Lưu ý về nginx: add_header đặt trong location sẽ THAY THẾ toàn bộ add_header
    # kế thừa từ khối server, chứ không cộng thêm. Nên ba header bảo mật phải được
    # nhắc lại trong mọi location có add_header riêng, nếu không chúng biến mất.

    # Tài sản có hash trong tên nên cache dài hạn được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Thay cho proxy của Vite khi chạy dev.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload và tải file lớn cần thời gian chờ rộng hơn mặc định.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # SPA dùng hash router: mọi đường dẫn đều trả index.html.
    #
    # index.html bắt buộc phải kiểm tra lại với máy chủ mỗi lần tải. Nó trỏ tới
    # tên tệp có hash, nên nếu trình duyệt giữ bản cũ thì sau khi triển khai bản
    # mới người dùng vẫn chạy giao diện cũ mà không hay biết — và phải Ctrl+F5
    # thủ công. Trước đây location này không gửi Cache-Control nào, trình duyệt
    # tự suy diễn thời hạn từ Last-Modified và giữ bản cũ hàng giờ.
    #
    # "no-cache" không có nghĩa là không lưu: trình duyệt vẫn lưu nhưng luôn hỏi
    # lại máy chủ, và nhận 304 rỗng nếu chưa đổi. Nhẹ hơn no-store nhiều.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
