# Nối thẳng tới NAS bằng giao thức SMB/CIFS, không cần hệ điều hành gắn sẵn.
#
# Dùng cách này khi:
#   - Chạy trên Windows (Docker Desktop không bind-mount được ổ mạng đã ánh xạ)
#   - Hoặc không muốn đụng tới /etc/fstab trên Linux
#
# Khai báo trong file .env ở gốc dự án (file này nằm trong .gitignore):
#   NAS_HOST=192.168.4.XX
#   NAS_SHARE=ten_share
#   NAS_USER=tai_khoan_nas
#   NAS_PASS=mat_khau_nas
#
# deploy.sh thấy NAS_HOST thì tự thêm  -f docker-compose.archive-cifs.yml.
#
# Nếu NAS đã được gắn sẵn ở mức hệ điều hành (Linux + /etc/fstab) thì dùng
# docker-compose.archive.yml thay cho file này — đặt ARCHIVE_HOST_DIR là đủ.

services:
  api:
    environment:
      ARCHIVE_DIR: /archive
    volumes:
      - archive:/archive

volumes:
  archive:
    driver: local
    driver_opts:
      type: cifs
      device: //${NAS_HOST:?can dat NAS_HOST trong .env}/${NAS_SHARE:?can dat NAS_SHARE trong .env}
      # uid/gid 1000 khớp user 'node' chạy trong container API, nếu không sẽ không ghi được.
      # vers=3.0 hợp với hầu hết NAS đời mới; NAS cũ có thể cần vers=2.1 hoặc 1.0.
      o: username=${NAS_USER:?can dat NAS_USER trong .env},password=${NAS_PASS:?can dat NAS_PASS trong .env},uid=1000,gid=1000,vers=${NAS_SMB_VERSION:-3.0},file_mode=0660,dir_mode=0770
