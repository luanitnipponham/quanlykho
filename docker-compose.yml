# HỆ THỐNG PHIẾU YÊU CẦU CHI — workflow v3.4
#
#   cp deploy/app.env.example deploy/app.env   # rồi sửa mật khẩu và JWT_SECRET
#   docker compose up -d --build
#   mở http://<địa-chỉ-máy-chủ>/
#
# Chỉ container web mở ra ngoài. API và PostgreSQL nằm trong mạng nội bộ của compose.
# Mọi cấu hình đọc từ deploy/app.env — cố ý không dùng ${...} cho các biến ở đó,
# vì nội suy của compose lấy từ shell / .env gốc chứ không phải từ env_file.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ./deploy/app.env
    environment:
      # Dữ liệu nằm trong thư mục con để volume không đụng lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ./deploy/app.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      STORAGE_DIR: /app/storage
    volumes:
      # Tệp đính kèm phải sống lâu hơn container.
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bản triển khai không được âm thầm lùi về chế độ demo trên trình duyệt.
        VITE_REQUIRE_BACKEND: 'true'
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  storage:
